<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlotAxis — Create account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=14" />
</head>
<body data-page="register">
  <section class="auth-screen">
    <div class="auth-visual" id="authVisual" aria-hidden="true"></div>
    <div class="auth-panel">
      <div class="auth-card">
        <h2 class="auth-title">Create account</h2>
        <form id="registerForm" class="auth-form" autocomplete="on">
          <label>Full name
            <input type="text" id="regName" placeholder="Your name" autocomplete="name" required />
          </label>
          <label>Email
            <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" required />
          </label>
          <label>Phone
            <input type="tel" id="regPhone" placeholder="03001234567" inputmode="numeric" pattern="03[0-9]{9}" maxlength="11" title="Enter exactly 11 digits starting with 03." autocomplete="tel" required />
          </label>
          <label>Password
            <span class="password-field">
              <input type="password" id="regPassword" data-toggle-password placeholder="Create a password" autocomplete="new-password" required />
            </span>
          </label>
          <div class="password-guidance" aria-live="polite" hidden>
            <p>Password requirements:</p>
            <ul>
              <li class="password-rule" data-password-rule="length"><span aria-hidden="true">○</span> At least 8 characters</li>
              <li class="password-rule" data-password-rule="uppercase"><span aria-hidden="true">○</span> One uppercase letter (A-Z)</li>
              <li class="password-rule" data-password-rule="lowercase"><span aria-hidden="true">○</span> One lowercase letter (a-z)</li>
              <li class="password-rule" data-password-rule="number"><span aria-hidden="true">○</span> One number (0-9)</li>
              <li class="password-rule" data-password-rule="symbol"><span aria-hidden="true">○</span> One special character (e.g. !@#)</li>
            </ul>
            <p class="password-strength" id="passwordStrength">Enter a password to check its strength.</p>
          </div>
          <label>Confirm Password
            <span class="password-field">
              <input type="password" id="regConfirmPassword" data-toggle-password placeholder="Confirm your password" autocomplete="new-password" required />
            </span>
          </label>
          <p class="password-match" id="passwordMatchMessage" aria-live="polite"></p>
          <p class="form-hint form-error" id="regError" role="alert"></p>
          <button type="submit" class="btn btn-primary btn-block" id="regSubmitBtn">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="index.html">Log in</a></p>
      </div>
    </div>
  </section>
  <script src="core.js?v=3"></script>
  <script src="auth-layout.js"></script>
  <script src="auth.js"></script>
</body>
</html>
