<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlotAxis — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=15" />
</head>
<body data-page="login">
  <section class="auth-screen">
    <div class="auth-visual" id="authVisual" aria-hidden="true"></div>
    <div class="auth-panel">
      <div class="auth-card">
        <h2 class="auth-title">Log in</h2>
        <form id="loginForm" class="auth-form" autocomplete="on">
          <label>Email
            <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required />
          </label>
          <label>Password
            <input type="password" id="loginPassword" data-toggle-password placeholder="Enter your password" autocomplete="current-password" required />
          </label>
          <p class="form-hint form-error" id="loginError" role="alert"></p>
          <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">Continue</button>
        </form>
        <p class="auth-switch">New to PlotAxis? <a href="register.html">Create account</a></p>
        <p class="auth-switch"><a href="admin.html">Admin payment verification</a></p>
      </div>
    </div>
  </section>
  <script src="core.js?v=3"></script>
  <script src="auth-layout.js"></script>
  <script src="auth.js"></script>
</body>
</html>
